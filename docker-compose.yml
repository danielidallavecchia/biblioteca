
services:
  web:
    build: .
    container_name: biblioteca_web
    # user: "1000:1000"
    command: sh -c "bundle exec rake db:create db:migrate && bundle exec rails s -b 0.0.0.0 -p 3000 --pid /tmp/server.pid"
    ports:
      - "3000:3000"
    volumes:
      - .:/biblioteca
      - bundle_cache:/usr/local/bundle
    depends_on:
      - db
    environment:
      RAILS_ENV: development
      DATABASE_URL: postgres://postgres:postgres@db:5432/biblioteca_development

  db:
    image: postgres:9.5
    container_name: biblioteca_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: biblioteca_development
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data

volumes:
  pg_data:
  bundle_cache:
